[project]
name = "finnews-sentiment"
version = "0.1.0"
description = "Educational financial-news sentiment classification pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.0,<2",
    "imbalanced-learn>=0.14,<1",
    "ipykernel>=6,<8",
    "ipywidgets>=8,<9",
    "joblib>=1.5,<2",
    "jupyterlab>=4,<5",
    "matplotlib>=3.10,<4",
    "nbconvert>=7,<8",
    "nltk>=3.9,<4",
    "numpy>=2.0,<3",
    "optuna>=4.0,<5",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "seaborn>=0.13,<1",
    "sentence-transformers>=5.0,<6",
    "spacy>=3.8,<4",
    "torch>=2.7,<3",
    "transformers>=4.50,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finnews_sentiment"]
